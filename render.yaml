services:
  - type: web
    name: hapo-marketing-dashboard
    env: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: META_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
